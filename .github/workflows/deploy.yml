name: Deploy Paleoware to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Paleoware
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL || 'https://paleoware-contact.paleoware.workers.dev/api/contact' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAF-lMOQ_GQRfCH3H' }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      - name: Validate public contact configuration
        run: |
          if [ -z "$NEXT_PUBLIC_CONTACT_API_URL" ]; then
            echo "Missing GitHub Actions variable: NEXT_PUBLIC_CONTACT_API_URL"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_TURNSTILE_SITE_KEY" ]; then
            echo "Missing GitHub Actions variable: NEXT_PUBLIC_TURNSTILE_SITE_KEY"
            exit 1
          fi
        env:
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.NEXT_PUBLIC_CONTACT_API_URL || 'https://paleoware-contact.paleoware.workers.dev/api/contact' }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAAF-lMOQ_GQRfCH3H' }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
